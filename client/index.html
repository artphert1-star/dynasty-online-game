const EVENT={drought:['🌵','ภัยแล้ง','ภาษีทำให้ไม่สงบ +2'],border:['⚔️','ศึกชายแดน','ทอยกำลังรบต้องได้ 2'],feast:['🎉','งานเลี้ยงหลวง','เงิน 2 แลกบารมี 1'],plague:['☠️','โรคระบาด','ปลายยุคระดับวัย +1']};
const T={rank:'ยศ I–V ขึ้น V ชนะทันที',i:'บารมีผู้นำใช้ทอยขอเลื่อนยศ',n:'เล่ห์เหลี่ยมใช้ทอยโจมตี',m:'กำลังรบใช้ป้องกัน กบฏ และหาร 2 เพิ่มเต๋าขึ้นยศ',gold:'เงินใช้ซื้อเต๋า ภรรยา ทหาร และติดสินบน',inf:'บารมีสุทธิ = สะสม − โทษบุญคุณค้าง ทุก 2 = 1 คะแนน สูงสุด 8 และอาจติดลบ บารมีใหม่ชำระโทษค้างก่อน',score:'คะแนนที่เห็นยังไม่รวมค่าความลับ ก่อนจบเกม',sol:'ทหารถือ ≤4 ใช้แล้วทิ้ง ≤2 ต่อการทอย',tok:'จำนวนใบในซอง มองไม่เห็นชนิดจนเปิด',unrest:'ความไม่สงบถึง 6 กบฏทันที',wife:'โบนัสภรรยาใช้กับผู้นำและหายเมื่อผู้นำตาย',heir:'ทายาทค่า ≥3 ให้เต๋า +1 กับค่านั้น ตัวสำรองและถูกกักไม่มีโบนัส',capt:'ค่าไถ่ตกลงกันเอง ไม่มีคืนอัตโนมัติ',sec:'ค่าลับเห็นเฉพาะเจ้าของ คนอื่นเห็นจำนวนและเป้าหมาย',regent:'ค่าทั้งสาม 2 วัย 1 ได้ทายาทแล้วขึ้นแทนทันที',age:'ปลายยุค 4–7 ทอยวัยตาม rulebook'};
const STYLES = [['assassin','🗡️','Assassin','ลอบสังหารคู่แข่งที่นำ'],['climber','🧗','Climber','ไต่ยศตรงๆ'],['warlord','⚔️','Warlord','สะสมทหาร ใช้กำลัง'],['balanced','⚖️','Balanced','สมดุลทุกด้าน'],['schemer','📜','Schemer','สืบข่าว เก็บความลับ'],['turtle','🛡️','Turtle','ป้องกันก่อน ค่อยขึ้น']];
const tip = (t, label) => `<span class="tip" tabindex="0" data-t="${esc(t)}">${label}</span>`;
const btn = (cls, label, js, extra = '') => `<button class="btn ${cls}" onclick="${js}" ${extra}>${label}</button>`;

// ---------- socket ----------
socket.on('connect', () => { if (code) socket.emit('joinRoom', { code, name: localStorage.name || '', pid }); });
socket.on('state', s => { S = s; code = s.code; localStorage.code = code; render(); });
socket.on('disconnect', () => { toast('การเชื่อมต่อขาด กำลังเชื่อมต่อใหม่…'); });
socket.on('connect_error', () => { toast('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ ตรวจสอบว่าเปิดเซิร์ฟเวอร์แล้ว'); });
socket.on('err', m => { if (!S) { localStorage.removeItem('code'); code = ''; } toast(m); });
function toast(m, ok) { toastMsg = m; toastOk = !!ok; render(); clearTimeout(toast.t); toast.t = setTimeout(() => { toastMsg = ''; render(); }, 3200); }
const nm = () => ($('name') ? $('name').value.trim() : localStorage.name || '');
function create() { localStorage.name = nm(); socket.emit('createRoom', { name: nm(), pid }); }
function join() { localStorage.name = nm(); code = $('code').value.trim().toUpperCase(); socket.emit('joinRoom', { code, name: nm(), pid }); }
const addBot = style => socket.emit('addBot', { code, style });
const rmBot = p => socket.emit('removeBot', { code, pid: p });
const start = () => socket.emit('startGame', code);
const chooseLeader = leaderId => socket.emit('chooseLeader',{code,leaderId});
const rematch = () => socket.emit('rematch', code);
function leave() { if (S && S.game && S.game.phase !== 'over' && !confirm('ออกจากห้อง? (กลับเข้าใหม่ได้ด้วยรหัสห้องเดิม)')) return; socket.emit('leaveRoom', code); localStorage.removeItem('code'); setTimeout(() => location.href = location.pathname, 150); }
function copyText(t, msg) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast(msg, true), () => prompt('คัดลอกข้อความนี้', t)); }
const inviteLink = () => location.origin + location.pathname + '?room=' + code;
function openHelp(tab) { helpOpen = true; if (tab) helpTab = tab; render(); }

// ---------- helpers ----------
const pl = id => S && S.game && S.game.players.find(p => p.id === id);
const nameOf = id => { const q = pl(id) || (S && S.members.find(m => m.pid === id)); return q && q.name; };
const idxOf = id => { const L = S && S.game ? S.game.players.map(p => p.id) : S ? S.members.map(m => m.pid) : []; const i = L.indexOf(id); return i < 0 ? 0 : i; };
const colorOf = id => PCOL[idxOf(id) % 6];
const av = (id, name, size = 36) => `<span class="av" style="--c:${colorOf(id)};width:${size}px;height:${size}px;font-size:${Math.round(size * .46)}px">${esc([...(name || '?')][0])}</span>`;
const rankPips = r => [1,2,3,4,5].map(k => `<i class="rk ${k <= r ? 'on' : ''} ${k === 5 ? 'v' : ''}"></i>`).join('');
const meter = u => `<div class="meter ${u >= 5 ? 'danger' : ''}">${[1,2,3,4,5,6].map(k => `<i class="${k <= u ? 'on ' + (u >= 5 ? 'h' : u >= 3 ? 'm' : '') : ''}"></i>`).join('')}</div>`;
const seatCap = (r, n) => r === 3 ? n - 1 : r === 4 ? 2 : r === 5 ? 1 : 99;
const section = (title, body, cls = '') => `<div class="card p-4 ${cls}"><div class="sec-title mb-3">${title}</div>${body}</div>`;
const orderLabel = x => `${OT[x.type] ? OT[x.type][0] + ' ' + OT[x.type][1] : x.type}${x.target ? ' → ' + esc(nameOf(x.target) || '?') : ''}${x.opt && OPTS[x.type] ? ' · ' + esc((OPTS[x.type].find(o => o[0] === x.opt) || ['', ''])[1]) : ''}${x.type === 'kidnap' && x.ransom ? ' · ไถ่ ' + x.ransom : ''}`;

function render() {
  const app = $('app'), y = window.scrollY;
  app.innerHTML = !S ? home() : !S.started ? lobby() : gameScreen();
  $('overlay').innerHTML = (helpOpen ? helpModal() : '') + (toastMsg ? `<div class="toast ${toastOk ? 'ok' : ''}">${esc(toastMsg)}</div>` : '');
  document.body.style.overflow = helpOpen ? 'hidden' : '';
  if (S && S.started) window.scrollTo(0, y);
}

  <h1 class="hero-title display">DYNASTY</h1>
  <p class="text-mute text-sm mt-2 mb-8">3-6 ผู้เล่น · 7 ยุค · กติกา v1.3 (Playtest)</p>

   <label class="text-xs text-mute">ชื่อตระกูลของคุณ</label>

   <div class="flex gap-2"><input id="code" class="fld text-center uppercase tracking-widest" maxlength="6" placeholder="รหัสห้อง" value="${esc(urlRoom)}">${btn('btn-green', 'เข้าร่วม', 'join()')}</div>
  </div>
  <div class="flex flex-wrap justify-center gap-2 mt-6 text-xs text-mute"><span class="badge">🎲 ทอยและแก้ผลในตา</span><span class="badge">🤖 เพิ่มบอทได้ 6 แบบ</span><span class="badge">🔗 ชวนเพื่อนด้วยลิงก์</span></div></div>`;
}

  const host = S.host === S.me, n = S.members.length;
  return `<div class="max-w-3xl mx-auto fade-in"><div class="flex justify-between items-center mb-4"><div class="display text-gold">⚜ DYNASTY</div>${btn('btn-ghost btn-sm', '⬅ ออกจากห้อง', 'leave()')}</div>
  <div class="card p-6 text-center mb-4"><div class="text-xs text-mute">รหัสห้อง</div><div class="display text-5xl sm:text-6xl text-gold my-2" style="letter-spacing:.25em">${S.code}</div>
   <div class="flex justify-center gap-2 flex-wrap">${btn('btn-sm', '📋 คัดลอกรหัส', `copyText('${S.code}','คัดลอกรหัสแล้ว')`)}${btn('btn-sm', '🔗 คัดลอกลิงก์เชิญ', `copyText(inviteLink(),'คัดลอกลิงก์เชิญแล้ว')`)}</div></div>
  <div class="grid md:grid-cols-5 gap-4">
   <div class="md:col-span-3">${section(`👥 ผู้เล่น ${n}/6 <span class="badge ${n >= 3 ? 'ok' : 'warn'}">${n >= 3 ? 'พร้อมเริ่ม' : 'ต้องมีอย่างน้อย 3'}</span>`,
    `<div class="space-y-2">${S.members.map((m, i) => `<div class="flex items-center gap-3 p-2 rounded-xl" style="background:rgba(0,0,0,.2)">${av(m.pid, m.name, 38)}<div class="flex-1 min-w-0"><div class="font-semibold truncate">${esc(m.name)} ${m.pid === S.me ? '<span class="badge gold">คุณ</span>' : ''} ${i === 0 ? '<span class="badge">เจ้าของห้อง</span>' : ''}</div><div class="text-xs text-mute">${m.bot ? '🤖 บอท · ' + m.style : 'ผู้เล่น'}</div></div>${m.bot && host ? btn('btn-sm btn-ghost', '✕', `rmBot('${m.pid}')`) : ''}</div>`).join('')}</div>`)}</div>
   <div class="md:col-span-2">${host ? section('🤖 เพิ่มบอท', `<div class="grid grid-cols-2 gap-2">${STYLES.map(([k, ic, nme, d]) => `<button class="otype" style="min-height:70px" onclick="addBot('${k}')"><span class="ic">${ic}</span>${nme}<span class="font-normal" style="font-size:.62rem">${d}</span></button>`).join('')}</div>`) : section('⏳ รอเจ้าของห้อง', '<p class="text-sm text-mute">เจ้าของห้องจะเพิ่มบอทและกดเริ่มเกม</p>')}</div></div>
  ${host ? `<div class="mt-4">${btn('btn-gold btn-lg w-full' + (n < 3 ? ' off' : ''), '⚔️ เริ่มเกม!', 'start()')}</div>` : ''}</div>`;
}
function leaderScreen(g,me) {
  const waiting=g.players.filter(p=>!p.bot&&!p.lead);
  const titles=['นักปราศรัยผู้มากบารมี','จอมสืบผู้เยือกเย็น','ขุนศึกแนวหน้า','นักการเมืองเจ้าเล่ห์','แม่ทัพผู้แยบยล','ผู้เฒ่าผู้ทรงบารมี','เจ้าแห่งเงามืด','แม่ทัพเฒ่าผ่านศึก'];
  return `<div class="fade-in"><div class="flex justify-between items-center mb-4"><div class="display text-gold">⚜ DYNASTY · v1.3</div>${btn('btn-ghost btn-sm','ออกจากห้อง','leave()')}</div>
    <div class="card card-hl p-5 mb-4"><h1 class="text-2xl font-bold text-gold">เลือกผู้นำของตระกูล</h1><p class="text-sm text-mute mt-2">ใครเลือกก่อนจะได้ก่อน การ์ดที่มีเจ้าของแล้วเลือกซ้ำไม่ได้ เมื่อทุกคนเลือกครบ เกมจะเริ่มทันที</p>
    <p class="text-sm mt-3">${me.lead?`คุณเลือก <b class="text-gold">${esc(me.lead.name)}</b> แล้ว · รอ ${esc(waiting.map(p=>p.name).join(', '))}`:'เลือกจาก 8 ผู้นำด้านล่าง · บอทจะเลือกจากใบที่เหลือหลังผู้เล่นเลือกครบ'}</p>
    <div class="flex flex-wrap gap-2 mt-3">${g.players.map(p=>`<span class="badge ${p.lead?'ok':''}">${esc(p.name)} · ${p.lead?esc(p.lead.name):p.bot?'รอเลือกหลังผู้เล่น':'กำลังเลือก'}</span>`).join('')}</div></div>
    <div class="leader-grid">${g.leaderChoices.map((l,i)=>`<article class="card leader-card ${l.takenBy?'taken':''}"><span class="badge ${l.takenBy?'gold':''}">${l.id} · วัย ${l.age}</span><h2 class="text-lg font-bold">${esc(l.name)}</h2><p class="text-sm text-mute">${titles[i]}</p><div class="grid grid-cols-3 gap-2 text-center">${[['i','✨ บารมี'],['n','🕵️ เล่ห์'],['m','⚔️ รบ']].map(([k,n])=>`<div class="stat"><div class="text-xs text-mute">${n}</div><div class="text-2xl font-bold" style="color:${STATC[k]}">${l.b[k]}</div></div>`).join('')}</div><p class="text-xs text-mute">${l.age?'วัย 1: ค่าสเตตัสสูงขึ้น แต่เสี่ยงเสียผู้นำจากวัยมากกว่า':'วัย 0: ความเสี่ยงจากวัยต่ำกว่าผู้นำวัย 1'}</p>${btn(l.takenBy?'':'btn-gold',l.takenBy?'เลือกแล้วโดย '+esc(nameOf(l.takenBy)):'เลือก '+esc(l.name),`chooseLeader('${l.id}')`,me.lead||l.takenBy?'disabled':'')}</article>`).join('')}</div></div>`;

// ---------- หน้าเกม: ส่วนหัว ขั้นตอน แบนเนอร์ ----------
const STEPS = ['เหตุการณ์', 'เจรจา', 'วางซองลับ', 'วนตา', 'ปลายยุค'];
const stepIdx = g => ({negotiation:1,placement:2,turns:3,aging:4,end:4,between:4,over:4}[g.phase] || 0);
function topbar(g) {
  const ev = EVENT[g.event];
  const dots = [1,2,3,4,5,6,7].map(e => `<div class="eraDot ${e < g.era ? 'done' : e === g.era ? 'cur' : ''}">${e}</div>${e < 7 ? `<div class="eraLine ${e < g.era ? 'done' : ''}"></div>` : ''}`).join('');
  return `<div class="flex flex-wrap items-center justify-between gap-3 mb-3"><div class="flex items-center gap-4 flex-wrap"><div class="display text-gold text-lg">⚜ DYNASTY</div><div class="flex items-center">${dots}</div></div>
  <div class="flex items-center gap-2 flex-wrap">${ev ? `<span class="badge warn">${tip(ev[2], ev[0] + ' ' + ev[1])}</span>` : ''}${btn('btn-sm', '📖 คู่มือ', 'openHelp()')}${btn('btn-sm btn-ghost', '⬅ ออก', 'leave()')}</div></div>`;
}
const stepper = (g, me) => { const c = stepIdx(g, me); return `<div class="flex mb-4 overflow-x-auto">${STEPS.map((s, i) => `<div class="step ${i < c ? 'done' : i === c ? 'cur' : ''}">${i + 1}. ${s}</div>`).join('')}</div>`; };
function dieFace(f, cls) {
  const P = { 1:[4], 2:[0,8], 3:[0,4,8], 4:[0,2,6,8], 5:[0,2,4,6,8], 6:[0,2,3,5,6,8] }[f] || [];
  return `<div class="die ${cls}">${[0,1,2,3,4,5,6,7,8].map(k => `<i class="${P.includes(k) ? 'on' : ''}"></i>`).join('')}</div>`;
}
let envelopeChoice = [], liveChoice = { type:'petition',opt:'tax',pick:'secret',pay:0,soldiers:0,count:2,stat:'i',wife:0 }, choiceEra=0;
const cmd = (event, data={}) => socket.emit(event,{code,...data});
const ready = () => cmd('ready');
const releaseHostage = () => cmd('release');
const feast = () => cmd('feast');
const useSecret = (idx,mode) => cmd('secret',{idx,mode});
function chooseEnvelope(type) { if(envelopeChoice.includes(type))envelopeChoice=envelopeChoice.filter(t=>t!==type);else if(envelopeChoice.length<pl(S.me).slots)envelopeChoice.push(type);render(); }
function updateAction(k,v) { liveChoice[k]=v;render(); }
function actionDefaults(type) { return {type,opt:type==='family'?defaultOpt(type,pl(S.me)):type==='assassinate'?'leader':'tax',pick:'secret',pay:0,soldiers:0,count:2,stat:'i',wife:0,target:S.game.players.find(p=>p.id!==S.me)?.id}; }
function chooseAction(type) { liveChoice=actionDefaults(type);render(); }
function defaultOpt(type,me) { return !me.wife?'marry':!me.heir&&!me.capt?'breed':'train'; }
function submitEnvelope() { cmd('submit',{orders:envelopeChoice.map(type=>({type}))}); }
function sendAction() { cmd('action',{order:liveChoice}); }
function endTurn() { if(confirm('จบตา? ช่องเปิดเผยที่เหลือและปฏิบัติการลับที่ยังไม่เปิดจะไม่ได้ใช้ในตานี้'))cmd('endTurn'); }
function response(data) { cmd('respond',data); }
function fieldValue(id) { return $(id)?.value; }
function selectField(id,options,selected,change='') { return `<select id="${id}" class="fld" ${change?`onchange="${change}"`:''}>${options.map(([v,n])=>`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(n)}</option>`).join('')}</select>`; }
function numeric(id,max=2,selected=0) { return selectField(id,Array.from({length:Math.max(0,max)+1},(_,i)=>[i,String(i)]),selected); }
function labeled(label,control) { return `<label class="block text-sm mt-3"><span class="text-mute">${label}</span><div class="mt-1">${control}</div></label>`; }
function diceStage(me) {
  const rolls=S.game.rolls||[];if(!rolls.length)return '';
  return section('🎲 ผลทอยล่าสุด',rolls.map(r=>`<div class="py-2"><div class="text-xs text-mute">${esc(r.name)} · ${esc(r.label)}</div><div class="flex flex-wrap items-center gap-2 mt-1">${r.faces.map(f=>dieFace(f,f>=4&&!r.die?'success':'')).join('')}<span class="badge">${r.die?(r.s?'ผู้นำตาย':'รอด'):r.turnOrder?'แต้มลำดับ '+r.s:r.s+' ความสำเร็จ'}</span></div></div>`).join(''));
}
function banner(g,me) {
  const names={negotiation:'เจรจา',placement:'วางซองลับ',turns:'วนตา',aging:'ทอยวัยและกบฏ',end:'ปลายยุค',between:'กำลังเริ่มยุคถัดไป',over:'จบเกม'};
  const mine=g.active===me.id&&g.phase==='turns',respond=g.pending?.responder===me.id;
  const detail=g.pending?`${nameOf(g.pending.responder)} กำลังเลือกตอบสนอง`:mine?`เปิดเผยเหลือ ${me.publicLeft} ช่อง · เปิดปฏิบัติการลับได้ในตานี้`:g.phase==='turns'?`ตาของ ${nameOf(g.active)}`:g.phase==='placement'?`ใส่ซองได้ 0–${me.slots} ใบ · ช่องที่เหลือไว้ทำการกระทำเปิดเผย`:g.phase==='negotiation'?'ส่งข้อตกลงแลกเงิน ความลับ ตัวประกัน หรือบุญคุณ · กดพร้อมเพื่อข้ามเวลาเมื่อทุกคนพร้อม':'';
  return `<div class="card ${mine||respond?'card-hl glow':''} p-4" aria-live="polite"><div class="flex justify-between items-center gap-3"><div><div class="font-bold text-gold">${respond?'ต้องตอบสนอง · ':mine?'ตาคุณ · ':''}${names[g.phase]||g.phase}</div><div class="text-sm text-mute mt-1">${esc(detail)}</div></div>${g.phase==='negotiation'?`<span class="badge" id="neg-clock" data-deadline="${g.deadline}"></span>`:''}</div>${g.turnOrder.length?`<div class="flex flex-wrap gap-2 mt-3">${g.turnOrder.map((id,i)=>`<span class="badge ${g.active===id?'gold':''}">${i+1}. ${esc(nameOf(id))}</span>`).join('')}</div>`:''}</div>`;
}
function responsePanel(g,me) {
  const q=g.pending;if(!q||q.responder!==me.id)return '';
  const head='⚡ เลือกตอบสนอง';let body='';
  if(q.kind==='lobby')body=`<p class="text-sm">${esc(nameOf(q.actor))} ขอเลื่อนยศ เปิดวิ่งเต้นเพื่อส่งผลต่อการทอยครั้งนี้</p><div class="flex flex-wrap gap-2 mt-3">${btn('btn-green','สนับสนุน +2',"response({choice:'support'})")}${btn('btn-red','ขัดขวาง −2',"response({choice:'oppose'})")}${btn('','ผ่าน เก็บการ์ดไว้',"response({choice:'pass'})")}</div>`;
  if(q.kind==='defense')body=`<p class="text-sm">${esc(nameOf(q.actor))} เปิด ${OT[q.order.type][1]} ใส่คุณ · ผู้โจมตีเพิ่ม ${q.order.pay} เต๋า</p>${me.envelope.some(c=>c.type==='guard'&&!c.opened)?'<label class="block mt-3"><input type="checkbox" id="reaction-guard" checked> เปิดป้องกัน +2 จนจบยุค</label>':''}${labeled('เงินเสริมเต๋าป้องกัน (ไม่เกิน 2)',numeric('reaction-pay',Math.min(2,me.money)))}${btn('btn-gold mt-3','ยืนยันและทอย',"response({guard:!!$('reaction-guard')?.checked,pay:Number(fieldValue('reaction-pay'))})")}`;
  if(q.kind==='petition'||q.kind==='rebellion')body=`<p class="text-sm">${q.kind==='petition'?'วิ่งเต้นครบแล้ว เลือกทหารและเงินก่อนทอยขอเลื่อนยศ':'เลือกทหารเพื่อปราบกบฏ · ไม่ซื้อเต๋าด้วยเงิน · เสมอถือว่าชนะ'}</p>${labeled('ทหารที่ใช้แล้วทิ้ง',numeric('reaction-sol',Math.min(2,me.soldiers)))}${q.kind==='petition'?labeled('เงินเสริมเต๋า',numeric('reaction-pay',Math.min(2,me.money))):''}${btn('btn-gold mt-3','🎲 ทอยตอนนี้',"response({soldiers:Number(fieldValue('reaction-sol')),pay:Number(fieldValue('reaction-pay')||0)})")}`;
  if(q.kind==='birth'){
    const opts=q.cards.map((c,i)=>[i,`${c.name} · วัย ${c.age} · บารมี/เล่ห์/รบ ${c.b.i}/${c.b.n}/${c.b.m}`]);
    body=`<p class="text-sm">เลือกทายาทจากการ์ดที่จั่ว</p>${labeled('ใบที่เก็บ',selectField('birth-first',opts,0))}${q.keepSpare&&!me.spare?labeled('ใบสำรอง (คนละใบ)',selectField('birth-second',[['','ไม่เก็บ'],...opts],'')):''}${btn('btn-gold mt-3','เก็บทายาท',"response({first:Number(fieldValue('birth-first')),second:fieldValue('birth-second')?Number(fieldValue('birth-second')):null})")}`;
  }
  if(q.kind==='destroy')body=`<p class="text-sm">คู่แข่งสืบสำเร็จ เลือกความลับเกี่ยวกับเขา 1 ใบที่จะถูกทำลาย</p>${selectField('destroy-secret',me.secrets.map((c,i)=>[i,c]).filter(([,c])=>c.about===q.actor).map(([i,c])=>[i,'ค่า '+c.v]),0)}${btn('btn-gold mt-3','ทิ้งใบที่เลือก',"response({index:Number(fieldValue('destroy-secret'))})")}`;
  return section(head,body);
}
function secretsPanel(g,me) {
  if(g.pending||g.usedSec||!me.secrets.length||!(g.phase==='negotiation'||g.phase==='turns'&&g.active===me.id))return '';
  return section('🤫 ใช้ความลับ · ไม่กินช่อง',me.secrets.map((c,i)=>`<div class="py-2"><span class="badge">ค่า ${c.v} → ${esc(nameOf(c.about))}</span><div class="flex gap-2 mt-2">${btn('btn-sm','รีดไถ',`useSecret(${i},'extort')`)}${g.phase==='turns'?btn('btn-sm','ปิดปาก · สุ่มซอง',`useSecret(${i},'hush')`):''}</div></div>`).join(''));
}
function termsLabel(terms) {
  if(!terms)return '';
  return terms.kind==='lobby'?`วิ่งเต้น${terms.choice==='support'?'สนับสนุน':'ขัดขวาง'} ${nameOf(terms.target)}`:terms.text;
}
function sendDeal() {
  const kind=fieldValue('deal-kind');
  const terms=kind==='lobby'?{kind,target:fieldValue('deal-lobby-target'),choice:fieldValue('deal-lobby-choice')}:{kind:'other',text:fieldValue('deal-text')};
  cmd('offer',{target:fieldValue('deal-target'),money:Number(fieldValue('deal-money')),secret:fieldValue('deal-secret')===''?null:Number(fieldValue('deal-secret')),favor:$('deal-favor').checked,release:!!$('deal-release')?.checked,terms});
}

  if(g.phase!=='negotiation'||g.pending)return '';
  const others=g.players.filter(p=>p.id!==me.id);
  let body=`<p class="text-sm text-mute">ผู้รับต้องยอมรับก่อนส่งมอบจริง หากแลกสองทางให้แต่ละฝ่ายส่งข้อเสนอของตัวเอง บุญคุณคือคำสัญญาที่ผู้รับมอบให้คุณ</p>
    ${labeled('ส่งให้',selectField('deal-target',others.map(p=>[p.id,p.name]),others[0]?.id))}
    ${labeled('เงินที่ส่ง',numeric('deal-money',Math.min(me.money,100)))}
    ${labeled('การ์ดความลับที่ส่ง',selectField('deal-secret',[['','ไม่ส่ง'],...me.secrets.map((c,i)=>[i,`ค่า ${c.v} เกี่ยวกับ ${nameOf(c.about)}`])],''))}
    <label class="block mt-3"><input type="checkbox" id="deal-favor"> ผู้รับมอบบุญคุณเป็นการตอบแทน</label>
    <details class="mt-3"><summary>ระบุคำสัญญาของบุญคุณ (จำเป็นเมื่อเลือกบุญคุณ)</summary>
    ${labeled('ชนิดคำสัญญา',selectField('deal-kind',[['lobby','วิ่งเต้น (ตรวจการเปิดการ์ดจริง)'],['other','สัญญาอื่น (ผู้ถือยืนยันผล)']],'lobby'))}
    ${labeled('ถ้าวิ่งเต้น: ทิศทาง',selectField('deal-lobby-choice',[['support','สนับสนุน +2'],['oppose','ขัดขวาง −2']],'support'))}
    ${labeled('ถ้าวิ่งเต้น: เป้าหมายที่ขอเลื่อนยศ',selectField('deal-lobby-target',g.players.map(p=>[p.id,p.name]),me.id))}
    ${labeled('ถ้าสัญญาอื่น: สิ่งที่ต้องทำ','<input class="fld" id="deal-text" maxlength="200" placeholder="เช่น ปล่อยทายาทของฉันในยุคที่เรียกใช้">')}
    </details>
    ${me.holding?'<label class="block mt-2"><input type="checkbox" id="deal-release"> ปล่อยทายาทตัวประกันให้ผู้รับ</label>':''}
    ${btn('btn-gold mt-3','ส่งข้อเสนอ','sendDeal()')}`;
  body+=(g.offers||[]).map(o=>`<div class="card p-3 mt-3"><b>${esc(nameOf(o.from))} → ${esc(nameOf(o.to))}</b><p class="text-sm">เงิน ${o.money}${o.secret?' · ความลับค่า '+o.secret.v:''}${o.release?' · ปล่อยทายาท':''}${o.favor?' · บุญคุณ: '+esc(termsLabel(o.terms)):''}</p>${o.to===me.id?btn('btn-green btn-sm mt-2','ยอมรับและรับของ',`cmd('accept',{offerId:${o.id}})`):'<span class="text-xs text-mute">รอผู้รับยอมรับ</span>'}</div>`).join('');
  return `<details class="card p-4"><summary class="font-bold text-gold cursor-pointer">🤝 ข้อตกลงและค่าไถ่ ${g.offers.length?'· '+g.offers.length+' ข้อเสนอ':''}</summary>${body}</details>`;
}
function favorsPanel(g,me) {
  if(g.pending||!['negotiation','turns'].includes(g.phase))return '';
  const mine=g.favors.filter(f=>f.holder===me.id||f.debtor===me.id);if(!mine.length)return '';
  return section('🤝 บุญคุณ',`<p class="text-xs text-mute">ผิดสัญญาเสียบารมี 2 ส่วนขาดค้างชำระด้วยบารมีที่ได้ใหม่</p>`+mine.map(f=>`<div class="py-2 text-sm"><b>${esc(nameOf(f.debtor))}</b> รับปาก ${esc(nameOf(f.holder))}<p class="text-mute">${esc(termsLabel(f.terms))}</p><span class="badge ${f.fulfilled?'ok':''}">${f.fulfilled?'ทำตามแล้ว':f.called===g.era?'เรียกใช้ยุคนี้แล้ว':'ยังไม่เรียกใช้'}</span><div class="mt-2">${f.holder===me.id&&f.called===null?btn('btn-sm','เรียกใช้',`cmd('favor',{tokenId:${f.id}})`):''}${f.holder===me.id&&f.terms.kind==='other'&&f.called===g.era&&!f.fulfilled?btn('btn-green btn-sm','ยืนยันว่าได้รับผลตามสัญญาแล้ว',`cmd('favor',{tokenId:${f.id},fulfill:true})`):''}${f.terms.kind==='lobby'&&!f.fulfilled?'<span class="text-xs text-mute">ระบบตรวจเมื่อเปิดวิ่งเต้นตรงเป้าหมายและทิศทางจริง</span>':''}</div></div>`).join(''));
}

function actionsPanel(g,me) {
  if(choiceEra!==g.era){choiceEra=g.era;envelopeChoice=[];chooseActionWithoutRender();}
  let acts='';
  if(!g.pending&&g.phase!=='over')me.secrets.forEach((c,i)=>{if(c.about===me.id)acts+=btn('btn-sm','ทิ้งความลับเกี่ยวกับตัวเอง',`cmd('discardSecret',{idx:${i}})`);});
  if(!g.pending&&me.holding&&g.phase!=='over')acts+=btn('btn-sm','ปล่อยตัวประกัน',"releaseHostage()");
  if(g.feast&&!g.pending&&['negotiation','placement','turns'].includes(g.phase))acts+=btn('btn-sm','งานเลี้ยง: เงิน 2 → บารมี 1','feast()');
  if(g.phase==='negotiation')acts+=btn('btn-green',me.ready?'พร้อมแล้ว':'พร้อมจบเจรจา','ready()',me.ready||g.pending?'disabled':'');
  if(g.phase==='end')acts+=`${btn('btn-sm','ติดสินบน 1',"cmd('bribe',{amount:1})",me.ready?'disabled':'')}${btn('btn-sm','ติดสินบน 2',"cmd('bribe',{amount:2})",me.ready?'disabled':'')}${btn('btn-green',me.ready?'พร้อมแล้ว':'พร้อมจบยุค','ready()',me.ready?'disabled':'')}`;
  return responsePanel(g,me)+(acts?section('การกระทำเพิ่มเติม',`<div class="flex flex-wrap gap-2">${acts}</div>`):'')+secretsPanel(g,me)+dealPanel(g,me)+favorsPanel(g,me);
}
function chooseActionWithoutRender(){liveChoice={type:'petition',opt:'tax',pick:'secret',pay:0,soldiers:0,count:2,stat:'i',wife:0,target:S.game.players.find(p=>p.id!==S.me)?.id};}
function builder(g,me) {
  if(g.phase==='placement'){
    if(me.placed!==null)return section('✉️ ซองล็อกแล้ว',`<p class="text-sm">คุณใส่ ${me.envelope.length} ใบ · เก็บไว้ทำเปิดเผย ${me.publicLeft} ช่อง · รอผู้เล่นอื่น</p>`);
    return section('✉️ เลือกซองลับ',`<p class="text-sm text-mute">แต่ละใบใช้หนึ่งช่อง เลือก 0 ใบได้ · เป้าหมายเลือกตอนเปิด</p><div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3">${['intrigue','kidnap','assassinate','lobby','guard'].map(t=>`<button class="otype ${envelopeChoice.includes(t)?'sel':''}" aria-pressed="${envelopeChoice.includes(t)}" onclick="chooseEnvelope('${t}')">${OT[t][0]} ${OT[t][1]}<span class="text-xs">${envelopeChoice.includes(t)?'เลือกแล้ว':'เลือก'}</span></button>`).join('')}</div><p class="text-sm mt-3">ซอง ${envelopeChoice.length}/${me.slots} · เปิดเผยเหลือ ${me.slots-envelopeChoice.length}</p>${btn('btn-gold w-full mt-3','ล็อกซองลับ','submitEnvelope()')}`);
  }
  if(g.phase!=='turns'||g.active!==me.id||g.pending)return '';
  const allowed=['petition','realm','family'].filter(t=>me.publicLeft>0&&!me.used.includes(t)).concat(me.envelope.filter(c=>!c.opened&&['intrigue','kidnap','assassinate'].includes(c.type)).map(c=>c.type));
  if(!allowed.includes(liveChoice.type)&&allowed.length)liveChoice=actionDefaults(allowed[0]);
  const a=liveChoice,others=g.players.filter(p=>p.id!==me.id),type=a.type;
  let controls='';
  if(['intrigue','kidnap','assassinate'].includes(type))controls+=labeled('เป้าหมาย',selectField('act-target',others.map(p=>[p.id,`${p.name}${p.protected?' · ผู้นำคุ้มครอง':''}`]),a.target,"updateAction('target',this.value)"));
  if(OPTS[type])controls+=labeled('เลือกวิธี',selectField('act-option',OPTS[type],a.opt,"updateAction('opt',this.value)"));
  if(type==='intrigue')controls+=labeled('ผลเมื่อสำเร็จ',selectField('act-pick',[['secret','รับความลับ (ชนะขาดได้ค่า 2)'],['destroy','ทำลายความลับเกี่ยวกับคุณ'],['release','ชิงทายาทคืน']],a.pick,"updateAction('pick',this.value)"));
  if(['intrigue','kidnap','assassinate'].includes(type))controls+=labeled('เงินเพิ่มเต๋าโจมตี',selectField('act-pay',Array.from({length:Math.min(2,me.money)+1},(_,i)=>[i,i+' เงิน']),a.pay,"updateAction('pay',Number(this.value))"));
  if(type==='realm'&&a.opt==='recruit')controls+=labeled('จำนวนทหาร',selectField('act-count',[[1,'1 ใบ'],[2,'2 ใบ']],a.count,"updateAction('count',Number(this.value))"));
  if(type==='family'&&a.opt==='train')controls+=labeled('ค่าที่ฝึก',selectField('act-stat',[['i','บารมี'],['n','เล่ห์เหลี่ยม'],['m','กำลังรบ']],a.stat,"updateAction('stat',this.value)"));
  if(type==='family'&&a.opt==='marry')controls+=labeled('ตลาดภรรยา',selectField('act-wife',g.market.map((w,i)=>[i,`${w.name} · ${w.price} เงิน · Fertility ${w.fert} · ${STN[w.s]} +${w.v}`]),a.wife,"updateAction('wife',Number(this.value))"));
  if(type==='petition'){const seats=g.players.filter(p=>p.rank===me.rank+1);if(seats.length>=(me.rank===2?g.players.length-1:me.rank===3?2:999))controls+=labeled('เลือกผู้ถูกลดยศเมื่อที่นั่งเต็ม',selectField('act-victim',[['','เลือกตระกูล'],...seats.map(p=>[p.id,p.name])],a.victim,"updateAction('victim',this.value)"));controls+='<p class="text-xs text-mute mt-3">ประกาศก่อนให้ผู้อื่นเปิดวิ่งเต้น แล้วคุณจะเลือกทหารและเงิน</p>';}
  return section('⚜ การกระทำในตาคุณ',`<div class="flex flex-wrap gap-2">${allowed.map(t=>btn(type===t?'btn-gold':'',OT[t][0]+' '+OT[t][1],`chooseAction('${t}')`)).join('')}</div>${allowed.length?`<p class="text-sm text-mute mt-3">${esc(DESC[type])}</p>${controls}${btn('btn-gold w-full mt-3',type==='petition'?'ประกาศขอเลื่อนยศ':'ยืนยันการกระทำและเปิดการ์ด','sendAction()')}`:'<p class="text-sm mt-3">ไม่มีการกระทำที่เหลือในตานี้</p>'}${btn('btn-ghost w-full mt-3','จบตา','endTurn()')}`);
}

  return section('✉️ ซองของคุณ',`<div class="flex flex-wrap gap-2">${me.envelope.map(c=>`<span class="badge ${c.opened?'':'gold'}">${OT[c.type][0]} ${OT[c.type][1]} · ${c.opened?'เปิดแล้ว / ถูกปิดปาก':'คว่ำอยู่'}</span>`).join('')}</div>`);
}
function ensureForm() {}
function helpModal() {
  const body=`<p class="text-sm mb-3">เกมหลัก v1.3 · 3–6 ผู้เล่น · 7 ยุค · ยศ V ชนะทันที</p><ol class="list-decimal pl-5 space-y-2 text-sm"><li>เหตุการณ์และเงินเดือน เติมภรรยา 3 ใบ</li><li>เจรจา 2 นาที (5–6 คน 3 นาที) ส่งข้อตกลงและแลกของ</li><li>วางซองพร้อมกัน 0–จำนวนช่อง ทุกใบกินช่อง</li><li>วนตา: ยศต่ำก่อน บารมีสุทธิสูงก่อน เสมอทอยเต๋า ล็อกลำดับทั้งยุค ทำเปิดเผยและเปิดปฏิบัติการลับในตาตัวเอง</li><li>ปลายยุค: ทอยวัยก่อน ติดสินบนเงิน 1 ลดไม่สงบ 1 สูงสุด 2 แล้วคืนการ์ด</li></ol><div class="mt-4 space-y-3">${Object.keys(OT).map(k=>`<div><b class="text-gold">${OT[k][0]} ${OT[k][1]}</b><p class="text-sm text-mute">${esc(DESC[k])}</p></div>`).join('')}</div><p class="text-sm mt-4">d6 ออก 4–6 = สำเร็จ · โจมตีต้องมากกว่า ป้องกันชนะเมื่อเสมอ · เงินเพิ่มเต๋าได้ฝ่ายละ 2 รวมไม่เกิน 10 · กบฏเสมอผู้นำชนะ กบฏและศึกชายแดนซื้อเต๋าด้วยเงินไม่ได้</p><p class="text-sm mt-3">บุญคุณ: ผิดสัญญาเสียบารมี 2 ส่วนขาดค้างหักบารมีใหม่ วิ่งเต้นตรวจจากการเปิดจริง สัญญาอื่นผู้ถือเป็นคนยืนยัน</p><p class="text-sm mt-3">ความลับใช้ 1 ใบ/ยุค: รีดไถช่วงเจรจาหรือตาตัวเอง ปิดปากได้เฉพาะตาตัวเองและสุ่มซอง · ใช้แล้วได้เต๋าขอเลื่อนยศครั้งต่อไป +1 · ถือไว้จบเกม ค่า 1–2 ให้ผู้ถือ +1 เป้าหมาย −1 ค่า 3 เป็น +2/−2</p><p class="text-sm mt-3">ทายาทถูกลักพาตัวสำเร็จ → ผู้นำคุ้มครองจนเหยื่อจบตาในยุคถัดไป ผู้นำที่เพิ่งขึ้นครองจากการตายก็คุ้มครอง ไม่มีไถ่ตัวอัตโนมัติ</p><p class="text-sm mt-3">คะแนน: ยศ 0/1/3/5 + บารมีสุทธิ÷2 (สูงสุด 8 อาจติดลบ) + ทายาทไม่ถูกกัก 2 + เงิน÷5 (สูงสุด 3) −1 หากไม่สงบ ≥4 แล้วนับความลับ เสมอดูยศ บารมีสุทธิ เงิน ถ้ายังเสมอชนะร่วมกัน</p>`;
  return `<div class="modal" role="dialog" aria-modal="true" aria-label="คู่มือ v1.3"><div class="card p-5 w-full max-w-2xl"><div class="flex justify-between mb-3"><b class="text-gold">📖 คู่มือ v1.3</b>${btn('btn-sm','ปิด','helpOpen=false;render()')}</div><div class="help-content">${body}</div></div></div>`;
}
setInterval(()=>{const el=$('neg-clock');if(el){const sec=Math.max(0,Math.ceil((Number(el.dataset.deadline)-Date.now())/1000));el.textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');}},1000);

function statBox(k, ico, name, p) {
  return `<div class="stat"><div class="text-[10px] text-mute">${tip(T[k], ico + ' ' + name)}</div><div class="flex items-baseline gap-1"><span class="n">${p.st[k]}</span>${p.hb && p.hb[k] ? `<span class="badge gold" title="โบนัสเต๋าจากทายาท">+1🎲</span>` : ''}</div>
  <div class="pips mt-1" style="--c:${STATC[k]}">${[1,2,3,4,5,6].map(i => `<i class="${i <= p.st[k] ? 'on' : ''}"></i>`).join('')}</div></div>`;
}
const STN = { i: 'บารมี', n: 'เล่ห์', m: 'รบ' };
function dynCard(p, me) {
  const mine = p.id === me.id, l = p.lead, hi = p.heir;
  const sec = mine && p.secrets && p.secrets.length ? p.secrets.map(c => `<span class="badge">${c.child ? '👶' : '🤫'}${c.child ? '' : c.v} → ${esc(nameOf(c.about) || '?')}</span>`).join(' ') : p.secretAbout.map(a => `<span class="badge">🤫 → ${esc(nameOf(a) || '?')}</span>`).join(' ');
  return `<div class="card p-4 ${mine ? 'card-me' : ''} fade-in">
  <div class="flex items-center gap-3">${av(p.id, p.name, 46)}<div class="min-w-0 flex-1"><div class="flex items-center gap-2 flex-wrap"><b class="truncate">${esc(p.name)}</b>${mine ? '<span class="badge gold">คุณ</span>' : ''}${p.protected ? '<span class="badge ok">ผู้นำคุ้มครอง</span>' : ''}${p.bot ? `<span class="badge">🤖 ${esc(p.style)}</span>` : ''}</div>
   <div class="text-xs text-mute flex items-center mt-1">${tip(T.rank, 'ยศ ' + RANK[p.rank - 1])} <span class="ml-2">${rankPips(p.rank)}</span></div></div>
   <div class="text-right"><div class="text-[10px] text-mute">${tip(T.score, '🏅 คะแนน')}</div><div class="text-2xl font-bold text-gold leading-none">${p.score}</div></div></div>
  <div class="text-xs flex flex-wrap items-center gap-1 mt-3"><span>${l.regent ? '👤' : '👑'}</span><b>${esc(l.name)}</b>${l.regent ? `<span class="badge warn">${tip(T.regent, 'ผู้สำเร็จราชการ')}</span>` : ''}<span class="badge">${tip(T.age, 'วัย ' + l.age)}</span></div>
  <div class="grid grid-cols-3 gap-2 mt-3">${statBox('i', '✨', 'บารมี', p)}${statBox('n', '🕵️', 'เล่ห์เหลี่ยม', p)}${statBox('m', '⚔️', 'กำลังรบ', p)}</div>
  <div class="grid grid-cols-3 gap-2 mt-2 text-center">
   <div class="stat"><div class="text-[10px] text-mute">${tip(T.gold, '💰 เงิน')}</div><div class="n text-gold">${p.money}</div></div>
   <div class="stat"><div class="text-[10px] text-mute">${tip(T.inf, '👑 บารมีสุทธิ')}</div><div class="n">${p.netInf}</div>${p.favorDebt?`<div class="text-xs text-mute">สะสม ${p.inf} · โทษค้าง ${p.favorDebt}</div>`:''}</div>
   <div class="stat"><div class="text-[10px] text-mute">${mine ? tip(T.sol, '🪖 ทหาร') : tip(T.tok, '▮ โทเคนคว่ำ')}</div><div class="n">${mine ? p.soldiers : p.tokensPlaced}</div></div></div>
  <div class="mt-3"><div class="text-[10px] text-mute mb-1 flex justify-between">${tip(T.unrest, '🔥 ความไม่สงบ')}<span>${p.unrest}/6</span></div>${meter(p.unrest)}</div>
  <div class="mt-3 text-xs space-y-1">
   <div>${tip(T.wife, '💍 ภรรยา')}: ${p.wife ? `<b>${esc(p.wife.name)}</b> <span class="text-mute">(${STN[p.wife.s]}+${p.wife.v})</span>` : '<span class="text-mute">—</span>'}</div>
   <div>${tip(T.heir, '🍼 ทายาท')}: ${hi ? `<b>${esc(p.heir.name)}</b> <span class="text-mute">${p.heir.b.i + p.heir.t.i}/${p.heir.b.n + p.heir.t.n}/${p.heir.b.m + p.heir.t.m}</span>${p.spare ? ` · สำรอง <b>${esc(p.spare.name)}</b>` : ''}` : p.heirKnown ? '<span class="badge ok">มีทายาท</span>' : '<span class="text-mute">ไม่มี</span>'}</div>
   ${p.capt ? `<div>${tip(T.capt, '⛓️ ทายาทถูกกัก')} <span class="badge bad">ถูกกัก</span></div>` : ''}${p.holding ? `<div>⛓️ กักทายาทของ <b>${esc(nameOf(p.holding.owner) || '')}</b> <span class="badge warn">เจรจาเพื่อปล่อย</span></div>` : ''}
   <div>${tip(T.sec, '🤫 ความลับ')}: ${sec || '<span class="text-mute">—</span>'}</div>
   ${!mine&&p.revealed.length?`<div>การ์ดที่เปิด: ${p.revealed.map(t=>`<span class="badge">${OT[t][0]} ${OT[t][1]}</span>`).join(' ')}</div>`:''}</div></div>`;
}

// ---------- แดชบอร์ด ----------
function binom(n, k) { if (k <= 0) return 1; if (k > n) return 0; let s = 0, c = 1; for (let i = 0; i <= n; i++) { if (i >= k) s += c; c = c * (n - i) / (i + 1); } return s / Math.pow(2, n); }
function leaderboard(g, me) {
  const rows = [...g.players].sort((a, b) => b.rank - a.rank || b.score - a.score || b.netInf - a.netInf || b.money - a.money);
  return section('📊 อันดับ', `<div class="space-y-2">${rows.map((p, i) => `<div class="flex items-center gap-2 p-2 rounded-xl ${p.id === me.id ? 'card-me' : ''}" style="background:rgba(0,0,0,.2)"><div class="w-5 text-center text-mute text-xs">${i + 1}</div>${av(p.id, p.name, 28)}<div class="flex-1 min-w-0"><div class="text-sm font-semibold truncate">${esc(p.name)}</div><div class="flex items-center">${rankPips(p.rank)}</div></div><div class="text-right text-xs"><div class="text-gold font-bold">🏅 ${p.score}</div><div class="text-mute">👑${p.netInf} · 💰${p.money}</div></div><div class="w-14">${meter(p.unrest)}</div></div>`).join('')}</div><div class="text-[11px] text-mute mt-2">เรียงตามยศ → คะแนน → บารมีสุทธิ → เงิน · แถบขวา = ความไม่สงบ</div>`);
}
function seatsOdds(g, me) {
  const n = g.players.length;
  let h = `<div class="space-y-2 text-xs">${[3, 4, 5].map(r => { const hs = g.players.filter(p => p.rank === r), cap = seatCap(r, n); return `<div class="flex items-center gap-2"><span class="badge ${hs.length >= cap ? 'bad' : 'ok'}">ยศ ${RANK[r - 1]} ${hs.length}/${cap}</span><span class="text-mute">${hs.map(p => esc(p.name)).join(', ') || 'ว่าง'}</span></div>`; }).join('')}</div><div class="text-[11px] text-mute mt-2">ที่นั่งเต็ม = ขอเลื่อนยศยากขึ้น +1 และคุณเลือกคนที่ถูกลดยศ</div>`;
  if (me.rank < 5) {
    const dice = Math.min(10, me.st.i + (me.hb ? me.hb.i : 0) + Math.min(2, me.soldiers || 0) + Math.floor(me.st.m / 2)), full = g.players.filter(p => p.rank === me.rank + 1).length >= seatCap(me.rank + 1, n), need = TH[me.rank - 1] + (full ? 1 : 0), pr = Math.round(binom(dice, need) * 100);
    h += `<div class="mt-3 p-3 rounded-xl" style="background:rgba(0,0,0,.25);border:1px solid var(--line)"><div class="flex justify-between items-end"><div><div class="text-[11px] text-mute">โอกาสขอเลื่อนยศของคุณ</div><div class="text-3xl font-bold text-gold leading-none">${pr}%</div></div><div class="text-right text-[11px] text-mute">เต๋า ${dice} ลูก · ต้องได้ ≥ ${need}${full ? ' (ที่นั่งเต็ม)' : ''}</div></div>
    <div class="h-2 rounded mt-2" style="background:var(--s3)"><div class="h-2 rounded" style="width:${pr}%;background:linear-gradient(90deg,var(--gold2),var(--gold))"></div></div>
    <div class="text-[11px] text-mute mt-2">บารมี ${me.st.i}${me.hb && me.hb.i ? ' + ทายาท 1' : ''} + ทหาร ${Math.min(2, me.soldiers || 0)} + รบ÷2 ${Math.floor(me.st.m / 2)} (ยังไม่รวมวิ่งเต้น/เงินเสริม/ความลับ) · เงินเดือนยุคหน้า <b>${SAL[me.rank - 1]}</b> · ช่องคำสั่ง <b>${SLOTS[me.rank - 1]}</b></div></div>`;
  }
  return section('🪑 ที่นั่งและโอกาส', h);
}
function chart(g) {
  const H = g.hist; if (!H || !H.length) return section('📈 ยศรายยุค', '<div class="text-xs text-mute">กราฟจะขึ้นหลังจบยุคแรก</div>');
  const W = 300, Ht = 120, x = e => 24 + (e - 1) * 266 / 6, y = r => 108 - (r - 1) * 88 / 4;
  const lines = g.players.map((p, i) => { const pts = H.map(h => { const q = h.p.find(z => z.id === p.id); return q ? `${x(h.era)},${y(q.r) + (i - 2) * 1.2}` : null; }).filter(Boolean); return `<polyline fill="none" stroke="${PCOL[i % 6]}" stroke-width="2.2" stroke-linejoin="round" points="${pts.join(' ')}"/>${pts.map(pt => `<circle cx="${pt.split(',')[0]}" cy="${pt.split(',')[1]}" r="2.6" fill="${PCOL[i % 6]}"/>`).join('')}`; }).join('');
  return section('📈 ยศรายยุค', `<svg viewBox="0 0 ${W} ${Ht}" class="w-full">${[1,2,3,4,5].map(r => `<text x="4" y="${y(r) + 3}" fill="#8e84a6" font-size="8">${RANK[r - 1]}</text><line x1="20" x2="${W}" y1="${y(r)}" y2="${y(r)}" stroke="#3a2f52" stroke-width=".6"/>`).join('')}${[1,2,3,4,5,6,7].map(e => `<text x="${x(e) - 2}" y="118" fill="#8e84a6" font-size="7">${e}</text>`).join('')}${lines}</svg>
  <div class="flex flex-wrap gap-2 text-xs mt-1">${g.players.map((p, i) => `<span style="color:${PCOL[i % 6]}">● ${esc(p.name)}</span>`).join('')}</div>`);
}
function logKind(l) {
  if (l.includes('คะแนนราชวงศ์')) return ['gold', '🏅'];
  if (/🎲/.test(l)) return ['roll', '🎲'];
  if (/ตาย|แพ้กบฏ|ลอบสังหาร|ลักพาตัว|ถูกจับ|ลดยศ/.test(l)) return ['bad', '💀'];
  if (/จักรพรรดิ|ผู้ชนะ|ปราบกบฏ|แต่งงาน|ขึ้นเป็น|รับบุตรบุญธรรม|ไถ่|หมดวาระ/.test(l)) return ['good', '✨'];
  return ['', '•'];
}
function logPanel(g) {
  return section('📜 บันทึกเหตุการณ์', `<div class="space-y-1 max-h-[340px] overflow-y-auto pr-1">${[...g.log].reverse().map(l => { const [k, ic] = logKind(l); return `<div class="logline ${k}"><span>${ic}</span><span>${esc(l)}</span></div>`; }).join('') || '<div class="text-xs text-mute">ยังไม่มีเหตุการณ์</div>'}</div>`);
}

// ---------- จบเกม / คู่มือ ----------
function endPanel(g, me) {
  if (g.phase !== 'over') return '';
  const rows = [...g.players].sort((a, b) => Number(g.winnerIds.includes(b.id))-Number(g.winnerIds.includes(a.id)) || b.score - a.score || b.rank - a.rank || b.netInf - a.netInf || b.money - a.money);
  const lines = g.log.filter(l => l.includes('คะแนนราชวงศ์'));
  const w = g.players.find(p => p.id === g.winnerId), emp = w && w.rank === 5, shared = g.winnerIds.length > 1;
  return `<div class="card card-hl p-6 text-center fade-in"><div class="text-5xl mb-2">${emp ? '👑' : '🏆'}</div><div class="text-xs text-mute">${emp ? 'จักรพรรดิองค์ใหม่' : shared?'ผู้ชนะร่วมด้วยคะแนนราชวงศ์':'ผู้ชนะด้วยคะแนนราชวงศ์'}</div><div class="hero-title display" style="font-size:2.4rem">${esc(g.winner)}</div>
  <div class="mt-4 space-y-2 text-left max-w-md mx-auto">${rows.map((p, i) => `<div class="flex items-center gap-2 p-2 rounded-xl" style="background:rgba(0,0,0,.25)"><span class="w-5 text-center text-mute text-xs">${i + 1}</span>${av(p.id, p.name, 28)}<b class="flex-1 truncate">${esc(p.name)}</b><span class="badge">ยศ ${RANK[p.rank - 1]}</span><span class="text-gold font-bold">🏅 ${p.score}</span></div>`).join('')}</div>
  ${lines.length ? `<div class="mt-3 text-left max-w-md mx-auto space-y-1">${lines.map(l => `<div class="logline gold"><span>🏅</span><span>${esc(l)}</span></div>`).join('')}</div>` : ''}
  <div class="mt-5 flex justify-center gap-2 flex-wrap">${S.host === S.me ? btn('btn-gold', '🔄 กลับล็อบบี้เล่นใหม่', 'rematch()') : '<span class="text-sm text-mute self-center">รอเจ้าของห้องเริ่มรอบใหม่</span>'}${btn('', 'ออก', 'leave()')}</div></div>`;
}
// ---------- ประกอบหน้าเกม ----------
function gameScreen() {
  const g = S.game, me = g && pl(S.me);
  if (!g || !me) return '<div class="card p-6 text-center">กำลังโหลด…</div>';
  if(g.phase==='leaders')return leaderScreen(g,me);
  ensureForm(g, me);
  const others = g.players.filter(p => p.id !== me.id);
  const main = [endPanel(g, me), banner(g, me), diceStage(me), actionsPanel(g, me),  builder(g, me), placedPanel(g, me), dynCard(me, me), others.length ? `<div class="sec-title mt-2">👥 ราชวงศ์คู่แข่ง</div><div class="grid sm:grid-cols-2 gap-4">${others.map(p => dynCard(p, me)).join('')}</div>` : ''];
  return `${topbar(g)}${stepper(g, me)}<div class="grid lg:grid-cols-3 gap-4"><div class="lg:col-span-2 space-y-4 min-w-0">${main.join('')}</div><div class="space-y-4 min-w-0 lg:sticky lg:top-3 self-start">${leaderboard(g, me)}${seatsOdds(g, me)}${chart(g)}${logPanel(g)}</div></div>`;
}
render();
</script>
</body>
</html>
