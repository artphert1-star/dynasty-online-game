<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynasty Online (v0.8 Playtest)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-4">

  <div id="view-home" class="w-full max-w-md bg-gray-800 p-8 rounded-xl shadow-2xl border border-amber-500/50 mt-10 text-center">
    <h1 class="text-4xl font-extrabold text-amber-500 mb-2">DYNASTY</h1>
    <p class="text-gray-400 text-sm mb-6">Playtest v0.8</p>
    <input id="input-name" type="text" placeholder="ชื่อตระกูล" class="w-full p-3 mb-4 rounded bg-gray-700 text-white text-center border border-gray-600 outline-none">
    <button onclick="createRoom()" class="w-full py-3 bg-amber-600 hover:bg-amber-500 font-bold rounded mb-4">สร้างห้องใหม่</button>
    <div class="flex space-x-2 mt-4">
      <input id="input-code" type="text" placeholder="รหัส 6 หลัก" class="flex-grow p-3 rounded bg-gray-700 text-white text-center uppercase outline-none" maxlength="6">
      <button onclick="joinRoom()" class="px-6 py-3 bg-green-600 hover:bg-green-500 font-bold rounded">Join</button>
    </div>
  </div>

  <div id="view-lobby" class="hidden w-full max-w-2xl bg-gray-800 p-6 rounded-xl mt-10">
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-amber-400">รหัสห้อง (Lobby)</h2>
      <div id="display-code" class="text-5xl font-mono text-green-400 font-bold mt-2">------</div>
    </div>
    
    <div id="host-controls" class="hidden border-t border-gray-700 pt-4">
      <p class="text-sm text-gray-400 mb-2">เพิ่มบอทจำลองพฤติกรรม (v0.8):</p>
      <div class="grid grid-cols-3 gap-2 mb-4">
        <button onclick="addBot('Assassin')" class="p-2 bg-red-900/80 hover:bg-red-700 rounded text-xs">🗡️ Assassin</button>
        <button onclick="addBot('Climber')" class="p-2 bg-blue-900/80 hover:bg-blue-700 rounded text-xs">🧗 Climber</button>
        <button onclick="addBot('Warlord')" class="p-2 bg-orange-900/80 hover:bg-orange-700 rounded text-xs">⚔️ Warlord</button>
        <button onclick="addBot('Balanced')" class="p-2 bg-purple-900/80 hover:bg-purple-700 rounded text-xs">⚖️ Balanced</button>
        <button onclick="addBot('Schemer')" class="p-2 bg-indigo-900/80 hover:bg-indigo-700 rounded text-xs">📜 Schemer</button>
        <button onclick="addBot('Turtle')" class="p-2 bg-green-900/80 hover:bg-green-700 rounded text-xs">🛡️ Turtle</button>
      </div>
      <button onclick="startGame()" class="w-full py-3 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold rounded">เริ่มเกม!</button>
    </div>
    <ul id="player-list" class="space-y-2 mt-4"></ul>
  </div>

  <div id="view-game" class="hidden w-full max-w-5xl mt-6">
    <div class="bg-gray-800 p-4 rounded-lg mb-6 border border-amber-500/30">
      <h3 class="font-bold text-amber-300 mb-3">จำลองการวางคำสั่ง (Playtest Tools):</h3>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <button onclick="sendAction('petition')" class="p-3 bg-amber-600 hover:bg-amber-500 rounded font-bold text-sm">📜 ขอเลื่อนยศ (บารมี + กำลังรบ/2)</button>
        <button onclick="sendAction('realmTax')" class="p-3 bg-blue-600 hover:bg-blue-500 rounded font-bold text-sm">💰 รีดภาษี (ได้เงิน แต่ความไม่สงบ +1)</button>
        <button onclick="sendAction('assassinate')" class="p-3 bg-red-600 hover:bg-red-500 rounded font-bold text-sm">🗡️ ลอบสังหาร (จ่าย 2 เงิน)</button>
      </div>
    </div>
    
    <div id="game-board" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6"></div>
    <div class="bg-gray-800 p-4 rounded-lg"><div id="action-logs" class="text-xs text-gray-300 space-y-1 max-h-40 overflow-y-auto"></div></div>
  </div>

  <script>
    // ⚠️ เปลี่ยนเป็น URL ของ Render 
    const socket = io('https://dynasty-online-game.onrender.com'); 
    let currentCode = '';

    function createRoom() { socket.emit('createRoom', document.getElementById('input-name').value); }
    function joinRoom() { socket.emit('joinRoom', { code: document.getElementById('input-code').value.toUpperCase(), name: document.getElementById('input-name').value }); }
    function addBot(archetype) { socket.emit('addBot', { code: currentCode, archetype }); }
    function startGame() { socket.emit('startGame', currentCode); }
    function sendAction(action) { socket.emit('playerAction', { code: currentCode, action }); }

    socket.on('roomJoined', (data) => {
      currentCode = data.code;
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-lobby').classList.remove('hidden');
      document.getElementById('display-code').innerText = currentCode;
    });

    socket.on('updateRoom', (data) => {
      const list = document.getElementById('player-list');
      list.innerHTML = '';
      if (data.players[0].id === socket.id) document.getElementById('host-controls').classList.remove('hidden');

      data.players.forEach(p => {
        list.innerHTML += `<li class="p-2 bg-gray-700 rounded flex justify-between"><span>${p.name}</span> <span class="text-xs">${p.type === 'bot' ? p.archetype : 'ผู้เล่น'}</span></li>`;
      });

      if (data.state === 'playing') {
        document.getElementById('view-lobby').classList.add('hidden');
        document.getElementById('view-game').classList.remove('hidden');
        renderBoard(data.players);
        document.getElementById('action-logs').innerHTML = data.logs.map(l => `<div>• ${l}</div>`).join('');
      }
    });

    function renderBoard(players) {
      const board = document.getElementById('game-board');
      board.innerHTML = '';
      players.forEach(p => {
        board.innerHTML += `
          <div class="p-4 bg-gray-800 rounded-lg border border-gray-700">
            <h4 class="font-bold text-amber-300 mb-2">${p.name} <span class="text-xs bg-gray-700 px-1 rounded">ยศ ${p.stats.rank}</span></h4>
            <div class="grid grid-cols-2 gap-2 text-xs">
              <div class="bg-gray-700 p-2 text-yellow-400">💰 เงิน: ${p.stats.gold}</div>
              <div class="bg-gray-700 p-2 text-red-400">🔥 ไม่สงบ: ${p.stats.unrest}/6</div>
              <div class="bg-gray-700 p-2">✨ บารมี: ${p.stats.influence}</div>
              <div class="bg-gray-700 p-2 text-purple-400">🗡️ เหลี่ยม: ${p.stats.intrigue}</div>
              <div class="bg-gray-700 p-2 text-blue-400 col-span-2">⚔️ กำลังรบ: ${p.stats.might}</div>
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
